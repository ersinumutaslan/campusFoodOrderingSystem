spring.application.name=campus-food-ordering

# Local development database from docker-compose.yml (port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/campusfood
spring.datasource.username=campusfood
spring.datasource.password=campusfood

# Include the reason (e.g. "Ayran is not available") in error responses
spring.web.error.include-message=always
# Include which request fields failed validation (e.g. customerId must not be null)
spring.web.error.include-binding-errors=always

# Flyway owns the schema; Hibernate only checks that the entities match the tables
spring.jpa.hibernate.ddl-auto=validate
# Load data only inside repository/service calls, not while writing the HTTP response
spring.jpa.open-in-view=false
