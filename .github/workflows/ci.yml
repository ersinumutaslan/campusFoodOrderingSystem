# Runs all tests on GitHub's computers for every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest   # comes with Docker, which the Testcontainers integration tests need

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven      # reuse downloaded libraries between runs, so later runs are faster

      - name: Build and run all tests
        run: mvn -B verify
